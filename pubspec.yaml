name: flutter_freelance_platform
description: Freelance Platform Flutter app with PocketBase backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^13.2.5
  pocketbase: ^0.23.3
  image_picker: ^0.8.9
  file_picker: ^8.1.2
  intl: ^0.18.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo-image.png